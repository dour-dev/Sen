name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Webview APK
        uses: Judson90/webview-to-apk-action@v1.0
        with:
          app-name: 'My Web App'
          web-url: 'https://username.github.io/ten-repo/'
          
